<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./public/css/output.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    
    <title>Document</title>
  </head>
  
  <body>
    <main >
     
<header
  id="Samir"
  class="flex items-center justify-between fixed z-50 w-full py-[1rem] px-5 pb-[1rem] lg:px-[5rem] lg:pb-[2rem] bg-white border-b-[0.5px] border-[#f2f2f2]"
>
  
  <input type="checkbox" id="menu-toggle" class="peer sr-only" />

  
  <h1 class="font-bold text-3xl btn bg-transparent border-0">
    Horizon<span class="text-[#ff5230]">.</span>
  </h1>

  
  <label
    for="menu-toggle"
    class="flex cursor-pointer items-center justify-center text-[#515257] lg:hidden peer-checked:hidden"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="1.8"
      class="h-9 w-9"
    >
      <path stroke-linecap="round" d="M3 6h18M3 12h18M3 18h18" />
    </svg>
  </label>

  
  <nav
    class="fixed left-7 right-7 top-[6rem] bottom-1 z-50 flex flex-col items-stretch justify-start gap-0 overflow-y-auto bg-white px-8 pt-5 text-[20px] font-medium text-[#515257] invisible opacity-0 pointer-events-none -translate-y-2 transition-all duration-300 peer-checked:visible peer-checked:opacity-100 peer-checked:pointer-events-auto peer-checked:translate-y-0 lg:visible lg:pointer-events-auto lg:opacity-100 lg:translate-y-0 lg:static lg:mx-auto lg:flex lg:max-w-5xl lg:flex-row lg:items-center lg:justify-center lg:gap-8 lg:overflow-visible lg:bg-transparent lg:p-0"
  >
    <a
      href="#"
      class="relative w-full py-4 lg:w-auto lg:pb-[1rem] lg:pt-[1rem] lg:after:bg-[#ff5230] after:absolute after:bottom-0 after:left-0 after:h-[2.5px] after:w-0 hover:after:w-full after:duration-300 text-[#515257] hover:text-[#ff5230] transition-[1s]"
      >Home</a
    >

    <a
      href="#about"
      class="relative w-full py-4 lg:w-auto lg:pb-[1rem] lg:pt-[1rem] lg:after:bg-[#ff5230] after:absolute after:bottom-0 after:left-0 after:h-[2.5px] after:w-0 hover:after:w-full after:duration-300 text-[#515257] hover:text-[#ff5230] transition-[1s]"
      >About</a
    >

    <a
      href="#services"
      class="relative w-full py-4 lg:w-auto lg:pb-[1rem] lg:pt-[1rem] lg:after:bg-[#ff5230] after:absolute after:bottom-0 after:left-0 after:h-[2.5px] after:w-0 hover:after:w-full after:duration-300 text-[#515257] hover:text-[#ff5230] transition-[1s]"
      >Services</a
    >

    <a
      href="#portfolio"
      class="relative w-full py-4 lg:w-auto lg:pb-[1rem] lg:pt-[1rem] lg:after:bg-[#ff5230] after:absolute after:bottom-0 after:left-0 after:h-[2.5px] after:w-0 hover:after:w-full after:duration-300 text-[#515257] hover:text-[#ff5230] transition-[1s]"
      >Portfolio</a
    >

    <a
      href="#team"
      class="relative w-full py-4 lg:w-auto lg:pb-[1rem] lg:pt-[1rem] lg:after:bg-[#ff5230] after:absolute after:bottom-0 after:left-0 after:h-[2.5px] after:w-0 hover:after:w-full after:duration-300 text-[#515257] hover:text-[#ff5230] transition-[1s]"
      >Team</a
    >

    <a
      href="#pricing"
      class="relative w-full py-4 lg:w-auto lg:pb-[1rem] lg:pt-[1rem] lg:after:bg-[#ff5230] after:absolute after:bottom-0 after:left-0 after:h-[2.5px] after:w-0 hover:after:w-full after:duration-300 text-[#515257] hover:text-[#ff5230] transition-[1s]"
      >Pricing</a
    >

    
    <div class="group relative w-full lg:w-auto">
      <a
        href="#"
        class="relative  flex w-full items-center justify-between py-4 lg:w-auto lg:justify-start lg:pb-[1rem] lg:pt-[1rem] lg:after:bg-[#ff5230] after:absolute after:bottom-0 after:left-0 after:h-[2.5px] after:w-0 hover:after:w-full after:duration-300 text-[#515257] hover:text-[#ff5230] transition-[1s]"
      >
        Dropdown

        <span
          class="ml-auto flex h-11 w-11 items-center justify-center rounded-full bg-[#feece9] lg:ml-0 lg:h-auto lg:w-auto lg:bg-transparent"
        >
        <i class="bi bi-chevron-down   transition duration-300 group-hover:rotate-180"></i>
          
        </span>
      </a>

      <div class="absolute left-0 top-full hidden pt-2 group-hover:block">
        <div
          class="w-44 rounded-lg border border-slate-100 bg-white py-2 text-sm shadow-lg"
        >
          <a
            href="#"
            class="block px-4 py-2 transition-[1s] hover:bg-[#feece9] hover:text-[#ff5230]"
            >Dropdown 1</a
          >

          <a
            href="#"
            class="block px-4 py-2 transition-[1s] hover:bg-[#feece9] hover:text-[#ff5230]"
            >Dropdown 2</a
          >

          <a
            href="#"
            class="block px-4 py-2 transition-[1s] hover:bg-[#feece9] hover:text-[#ff5230]"
            >Dropdown 3</a
          >
        </div>
      </div>
    </div>

    <a
      href="#contact"
      class="relative w-full py-4 lg:w-auto lg:pb-[1rem] lg:pt-[1rem] lg:after:bg-[#ff5230] after:absolute after:bottom-0 after:left-0 after:h-[2.5px] after:w-0 hover:after:w-full after:duration-300 text-[#515257] hover:text-[#ff5230] transition-[1s]"
      >Contact</a
    >
  </nav>

  
  <label
    for="menu-toggle"
    class="invisible pointer-events-none fixed inset-0 z-40 bg-black/80 opacity-0 transition-all duration-300 peer-checked:visible peer-checked:pointer-events-auto peer-checked:opacity-100 lg:hidden"
  ></label>

  
  <label
    for="menu-toggle"
    class="fixed right-7 top-6 z-60 hidden cursor-pointer text-white peer-checked:flex lg:hidden"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="2"
      class="h-9 w-9"
    >
      <path stroke-linecap="round" stroke-linejoin="round" d="M6 6l12 12M18 6L6 18" />
    </svg>
  </label>

  
  <button
    class="btn max-sm:hidden bg-[#ff5230] py-[30px] px-[35px] hover:bg-[#ae2003] hover:translate-y-[-0.2rem] transition duration-300 rounded-full text-white text-xl"
  >
    Star a Project
  </button>
</header>


     
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </body>
</html>
